name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: auth_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Verify migrations apply and reverse cleanly
        env:
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: auth_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Run tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
          TEST_DB_NAME: auth_test
        run: uv run pytest
